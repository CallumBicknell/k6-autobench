name: collectors-demo

target:
  base_url: http://localhost:3000

workload:
  type: http
  requests:
    - name: feed
      method: GET
      path: /feed
      weight: 70

    - name: create_post
      method: POST
      path: /posts
      weight: 30
      body: '{"title":"hello"}'
      headers:
        Content-Type: application/json

run:
  rate: 500
  duration: 1m
  time_unit: 1s

thresholds:
  error_rate:
    max: 0.01
  latency:
    p95:
      max: 250ms
    p99:
      max: 1s

# Windowed analysis, so a resource peak can be read against the latency window it
# landed in: the SYSTEM table's PEAK AT column uses the same timeline as the
# window labels.
analysis:
  window: 10s

# Resource collectors sample a system's own metrics while it is loaded, so the
# report can say what the system was doing when it ran out of capacity rather than
# only how slow it got. Four kinds are available; use whichever the target
# supports, or several at once.
#
# A collector is advisory: if a source is unreachable, or a query has a typo, the
# report says so and the run carries on. The verdict is never affected.
collectors:
  interval: 5s

  # Whatever the target already exports, through PromQL. Covers the most ground
  # when there is monitoring in place.
  prometheus:
    - name: api
      url: http://localhost:9090
      queries:
        - name: cpu
          query: rate(process_cpu_seconds_total{job="api"}[1m])
          unit: cores
        - name: memory
          query: process_resident_memory_bytes{job="api"}
          unit: bytes
        - name: goroutines
          query: go_goroutines{job="api"}

  # For a target with no monitoring installed at all: everything Docker runs
  # already exports CPU and memory, and reaching it needs only the socket.
  docker:
    - name: postgres
      container: my-postgres
      # socket: /var/run/docker.sock   # defaults to $DOCKER_HOST, then this

  # The host autobench itself runs on -- the *load generator*, not the target.
  # Its CPU, memory and load answer the question a saturation verdict raises:
  # was the generator, rather than the target, the thing that ran out?
  system:
    - name: generator

  # For a cluster with no Prometheus: the metrics API is what `kubectl top`
  # reads. Usage is summed across the selected pods.
  # kubernetes:
  #   - name: cluster-api
  #     url: https://127.0.0.1:6443
  #     # token: ""                   # defaults to $AUTOBENCH_K8S_TOKEN, then a
  #     #                             # mounted service account token
  #     namespace: default
  #     selector: app=api
  #     insecure: true                # or ca_file: /path/to/ca.pem, not both

# `autobench run examples/collectors.yaml` prints the SYSTEM table after the
# windowed view, and a LIKELY CORRELATED table naming the resources that moved
# with the latency. Add `--html report.html` for the same in the report.
